<div class="container mt-4">
    <div class="tarjeta">
        {{estudiante().nombre}}
        Edad: {{estudiante().edad}}
        Promedio: {{estudiante().promedio}}
        @if(estudiante().promedio >= 9){
            <div class="excelente">Excelente</div>
        }
        @if(estudiante().promedio < 9 && estudiante().promedio >= 5){
            <div class="bien">Buen trabajo</div>
        }
        @if(estudiante().promedio < 5){
            <div class="alerta">Necesita Mejorar</div>
        }
    </div>
</div>
