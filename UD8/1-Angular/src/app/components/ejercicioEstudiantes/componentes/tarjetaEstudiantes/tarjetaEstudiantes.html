<div class="container mt-4">
    <div class="tarjeta" [ngClass]="estudiante().promedio >= 5 ? 'aprobado' : 'suspenso'">
        <h3>{{estudiante().nombre}}</h3>
        <p>Edad: {{estudiante().edad}}</p>
        <p class="promedio">Promedio: {{estudiante().promedio | nota}}</p>
        @if(estudiante().promedio >= 9){

        <div class="excelente">Excelente</div>
        }
        @if(estudiante().promedio < 9 && estudiante().promedio>= 5){

            <div class="bien">Buen trabajo</div>
            }
            @if(estudiante().promedio < 5){ <div class="alerta">Necesita Mejorar
    </div>
    }
    <button [ngStyle]="obtenerEstiloBoton()" (click)="eliminar()">Eliminar</button>
</div>
</div>
