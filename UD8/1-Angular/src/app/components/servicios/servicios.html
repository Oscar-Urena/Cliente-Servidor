<h1>Servicios</h1>
<hr>
<div class="row">
@for(cliente of aClientes.getClientes(); track $index){
<mat-card class="example-card" appearance="outlined">
    <mat-card-header>
        <div mat-card-avatar class="example-header-image"></div>
        <mat-card-title>{{cliente.email}}</mat-card-title>
        <mat-card-subtitle>{{cliente.first_name}} {{cliente.last_name}}</mat-card-subtitle>
    </mat-card-header>
    <img mat-card-image src="{{cliente.avatar}}" alt="Photo of a Shiba Inu">
</mat-card>
}@empty{
    <h3>No hay clientes</h3>
}
</div>
<section>
  <div class="example-button-row">
    <button matButton="filled" (click)="goHome()">Home</button>
  </div>
</section>
<div class="" style="padding-block: 200px;"></div>
